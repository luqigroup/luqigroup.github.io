<header class="site">
  <h1><a href="index.html">LUQI Group</a></h1>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">&#9680;</button>
  <nav class="site-menu">
    <ul>
      <li><a class="nav-home" href="index.html">Home</a></li>
      <li><a class="nav-members" href="members.html">Team members</a></li>
      <li><a class="nav-research" href="research.html">Research</a></li>
    </ul>
  </nav>
</header>
<script>
  // light/dark toggle, remembered across pages
  document.querySelector("header.site .theme-toggle").addEventListener("click", function () {
    var root = document.documentElement, dark = root.getAttribute("data-theme") === "dark";
    if (dark) root.removeAttribute("data-theme"); else root.setAttribute("data-theme", "dark");
    try { localStorage.setItem("theme", dark ? "light" : "dark"); } catch (e) {}
  });
</script>
